[package]
name = "waller"
version = "0.1.0"
edition = "2021"
description = "Multi-Monitor Wallpaper Manager"

[lib]
name = "waller_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dirs = "6.0.0"
base64 = "0.22.1"
thiserror = "2.0.18"
log = "0.4.29"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
