name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: WinUI build artifact (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set package version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH."
          }
          .\native\scripts\SetPackageVersion.ps1 -Version "$version.0"
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Verify and build Release
        shell: pwsh
        run: .\scripts\Invoke-Native.ps1 -Task Verify -SkipSmoke -ReleaseBuild -Platform x64

      - name: Create WinUI build archive
        id: archive
        shell: pwsh
        run: |
          $searchRoot = '.\native\Waller.Native.App\bin\x64\Release'
          $exe = Get-ChildItem -LiteralPath $searchRoot -Filter 'Waller.Native.App.exe' -Recurse -File |
            Select-Object -First 1
          if ($null -eq $exe) {
            throw "Release output executable was not found under $searchRoot."
          }
          $archive = "Waller-${{ steps.version.outputs.VERSION }}-windows-x64-build.zip"
          Compress-Archive -Path (Join-Path $exe.DirectoryName '*') -DestinationPath $archive
          "PATH=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Waller-${{ steps.version.outputs.VERSION }}-windows-x64-build
          path: ${{ steps.archive.outputs.PATH }}

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Waller v${{ steps.version.outputs.VERSION }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.archive.outputs.PATH }}
          body: |
            Automated WinUI x64 build artifact.

            This archive is not a signed public installer. Production signing, clean-machine install, and Store qualification remain release gates.
