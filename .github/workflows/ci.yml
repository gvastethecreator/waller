name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-verify:
    name: WinUI verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run native verification
        shell: pwsh
        run: .\scripts\Invoke-Native.ps1 -Task Verify -SkipSmoke
